#cloud-config
# GENERATED FILE — do not edit directly.
# Edit cloud-init.yaml.tpl and the standalone .sh files, then run:
#   python3 build-cloud-init.py
#

# User setup
users:
  - name: vya
    groups: sudo, docker
    shell: /bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    # Generate hash with: mkpasswd --method=SHA-512 YOUR_PASSWORD
    # Or: python3 -c "import crypt; print(crypt.crypt('YOUR_PASSWORD', crypt.mksalt(crypt.METHOD_SHA512)))"
    passwd: $6$PLACEHOLDER$REPLACE_THIS_WITH_YOUR_HASHED_PASSWORD

# Package management
package_update: true
package_upgrade: true

packages:
  # Base utilities
  - curl
  - wget
  - git
  - zsh
  - zip
  - unzip
  - tmux
  - python3-venv
  # Locale and build tools
  - locales
  - build-essential
  - software-properties-common
  # Dev tools
  - fzf
  - ripgrep
  - fd-find
  - luarocks
  # Security
  - ufw
  - fail2ban
  # Docker dependencies
  - ca-certificates
  - gnupg
  - lsb-release

# Locale setup
locale: en_US.UTF-8

# Write files
write_files:
  # Shared system setup script (same as Docker uses)
  - path: /opt/setup-system.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail

      # ── Version pins (single source of truth) ──
      TMUX_VERSION=3.6a
      NODE_VERSION=25.2.1
      NVIM_VERSION=0.11.5
      CODEX_ACP_VERSION=0.9.2

      export DEBIAN_FRONTEND=noninteractive

      # ── Locale ──
      apt-get update
      apt-get install -y locales curl nvtop
      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      # ── R repository ──
      curl -fsSL https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc |
        tee -a /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc >/dev/null
      echo "deb https://cloud.r-project.org/bin/linux/ubuntu noble-cran40/" \
        > /etc/apt/sources.list.d/cran.list

      # ── APT packages ──
      apt-get update
      apt-get install -y \
        r-base git fzf ripgrep build-essential fd-find \
        software-properties-common zsh wget unzip luarocks
      apt-get clean
      rm -rf /var/lib/apt/lists/*
      rm -f /etc/apt/sources.list.d/cran.list

      # ── tmux ──
      curl -sSL "https://github.com/tmux/tmux-builds/releases/download/v${TMUX_VERSION}/tmux-${TMUX_VERSION}-linux-x86_64.tar.gz" |
        tar xz -C /usr/local/bin

      # ── Node.js ──
      curl -LO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
      tar xf "node-v${NODE_VERSION}-linux-x64.tar.gz" -C /opt/
      ln -sf /opt/node-v${NODE_VERSION}-linux-x64/bin/* /usr/local/bin/
      npm config set prefix /usr/local/
      npm install -g \
        mcp-hub \
        @openai/codex \
        @github/copilot-language-server \
        @zed-industries/claude-code-acp
      rm "node-v${NODE_VERSION}-linux-x64.tar.gz"

      # ── lazygit ──
      LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" |
        grep -Po '"tag_name": *"v\K[^"]*')
      curl -Lo /tmp/lazygit.tar.gz \
        "https://github.com/jesseduffield/lazygit/releases/download/v${LAZYGIT_VERSION}/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz"
      tar xf /tmp/lazygit.tar.gz -C /tmp lazygit
      install /tmp/lazygit /usr/local/bin/
      rm /tmp/lazygit.tar.gz /tmp/lazygit

      # ── codex-acp ──
      curl -sSL "https://github.com/zed-industries/codex-acp/releases/download/v${CODEX_ACP_VERSION}/codex-acp-${CODEX_ACP_VERSION}-x86_64-unknown-linux-gnu.tar.gz" |
        tar -xz -C /usr/local/bin

      # ── Neovim ──
      curl -LO "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
      tar xzf nvim-linux-x86_64.tar.gz -C /opt
      ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
      rm nvim-linux-x86_64.tar.gz

      echo "System setup complete."

  # Shared user setup script (same as Docker uses)
  - path: /home/vya/setup-user.sh
    permissions: '0755'
    owner: vya:vya
    content: |
      #!/bin/bash
      set -euo pipefail

      # ── Python (uv) ──
      # If uv isn't on PATH yet (cloud-init case), install it
      if ! command -v uv &>/dev/null; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
      fi

      curl -fsSL https://claude.ai/install.sh | bash

      uv python install 3.12
      uv venv --python 3.12

      export VIRTUAL_ENV="$HOME/.venv"
      export UV_CACHE_DIR="$HOME/.uv-cache"
      export UV_PROJECT_ENVIRONMENT="$HOME/.venv"
      export PATH="$VIRTUAL_ENV/bin:$HOME/.local/bin:$PATH"

      # ── Python tools ──
      uv tool install 'vectorcode[lsp,mcp]'
      uv pip install --upgrade --no-cache-dir ipython pyright

      # ── Neovim config ──
      if [ ! -d "$HOME/.config/nvim" ]; then
        git clone https://github.com/vyakimov/neovim_setup.git ~/.config/nvim
      fi
      nvim --headless "+Lazy! sync" +qa || true

      # ── Dotfiles ──
      if [ -f "$HOME/setup-dotfiles.sh" ]; then
        chmod +x "$HOME/setup-dotfiles.sh"
        "$HOME/setup-dotfiles.sh"
      fi

      # ── Zsh ecosystem ──
      if [ -d "$HOME/.oh-my-zsh" ]; then
        echo "Oh My Zsh already installed, skipping..."
      else
        git clone https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
      fi

      ZSH_CUSTOM="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}"

      if [ ! -d "$ZSH_CUSTOM/themes/powerlevel10k" ]; then
        git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$ZSH_CUSTOM/themes/powerlevel10k"
      fi

      if [ ! -d "$HOME/.oh-my-zsh/plugins/zsh-vim-mode" ]; then
        git clone https://github.com/softmoth/zsh-vim-mode.git "$HOME/.oh-my-zsh/plugins/zsh-vim-mode"
      fi

      # ── gitstatusd (powerlevel10k) ──
      mkdir -p "$HOME/.cache/gitstatus"
      curl -sSL -o "$HOME/.cache/gitstatus/gitstatusd-linux-x86_64" \
        https://github.com/zinox9/zsh-windows/raw/refs/heads/master/Resources/powerlevel10k/powerlevel10k/gitstatus/bin/gitstatusd-linux-x86_64-static
      chmod +x "$HOME/.cache/gitstatus/gitstatusd-linux-x86_64"

      # ── Terminfo ──
      curl -sSL https://raw.githubusercontent.com/alacritty/alacritty/master/extra/alacritty.info |
        tic -x - 2>/dev/null || true
      curl -sSL https://gist.githubusercontent.com/vyakimov/d17c01ab4ebab804e8393563980f557b/raw/9098c07250d144c71fd4bdb8873ec91673e68b14/ghostty.info |
        tic -x - 2>/dev/null || true

      echo "User setup complete."

  # Dotfiles setup (bare git repo checkout)
  - path: /home/vya/setup-dotfiles.sh
    permissions: '0755'
    owner: vya:vya
    content: |
      #!/bin/bash
      set -e # Exit on error
      # Colors for output
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m' # No Color

      echo -e "${GREEN}Starting dotfiles setup...${NC}"

      # Add .cfg.git to gitignore if not already present
      if ! grep -q "^\.cfg\.git$" "$HOME/.gitignore" 2>/dev/null; then
        echo ".cfg.git" >>"$HOME/.gitignore"
        echo -e "${GREEN}✓ Added .cfg.git to .gitignore${NC}"
      else
        echo -e "${YELLOW}→ .cfg.git already in .gitignore${NC}"
      fi

      # Clone bare repository
      echo -e "${GREEN}Cloning dotfiles repository...${NC}"
      if [ -d "$HOME/.cfg.git" ]; then
        echo -e "${YELLOW}→ .cfg.git already exists, removing...${NC}"
        rm -rf "$HOME/.cfg.git"
      fi
      git clone --bare https://github.com/vyakimov/dotfiles.git "$HOME/.cfg.git"
      echo -e "${GREEN}✓ Dotfiles repository cloned${NC}"

      # Create backup directory
      mkdir -p "$HOME/.config-backup"
      echo -e "${GREEN}✓ Created backup directory${NC}"

      # Backup conflicting files
      echo -e "${GREEN}Checking for conflicting files...${NC}"
      CONFLICTS=$(git --git-dir="$HOME/.cfg.git/" --work-tree="$HOME" checkout 2>&1 | grep -E "^\s+" | awk '{print $1}' || true)

      if [ -n "$CONFLICTS" ]; then
        echo -e "${YELLOW}Found conflicting files, backing up:${NC}"
        echo "$CONFLICTS" | while read -r file; do
          if [ -n "$file" ]; then
            # Create the parent directory in backup location
            mkdir -p "$HOME/.config-backup/$(dirname "$file")"
            # Move the conflicting file to backup
            if [ -e "$HOME/$file" ]; then
              mv "$HOME/$file" "$HOME/.config-backup/$file"
              echo -e "  ${YELLOW}→ Backed up: $file${NC}"
            fi
          fi
        done
        echo -e "${GREEN}✓ Conflicting files backed up${NC}"
      else
        echo -e "${GREEN}✓ No conflicting files found${NC}"
      fi

      # Checkout dotfiles
      echo -e "${GREEN}Checking out dotfiles...${NC}"
      git --git-dir="$HOME/.cfg.git/" --work-tree="$HOME" checkout
      git --git-dir="$HOME/.cfg.git/" --work-tree="$HOME" config --local status.showUntrackedFiles no
      echo -e "${GREEN}✓ Dotfiles checked out${NC}"

      echo -e "${GREEN}✅ Dotfiles setup complete!${NC}"
      echo -e "${YELLOW}Note: Backed up files can be found in ~/.config-backup/${NC}"

  # Environment variables for zsh
  - path: /home/vya/.zshenv.local
    permissions: '0644'
    owner: vya:vya
    content: |
      export LANG=en_US.UTF-8
      export LANGUAGE=en_US:en
      export LC_ALL=en_US.UTF-8
      export TERM=xterm-256color
      export VIRTUAL_ENV="$HOME/.venv"
      export UV_CACHE_DIR="$HOME/.uv-cache"
      export UV_PROJECT_ENVIRONMENT="$HOME/.venv"
      export PATH="$VIRTUAL_ENV/bin:$HOME/.local/bin:$PATH"

# Run commands
runcmd:
  # Copy SSH keys from root to vya
  - mkdir -p /home/vya/.ssh
  - cp /root/.ssh/authorized_keys /home/vya/.ssh/authorized_keys 2>/dev/null || true
  - chown -R vya:vya /home/vya/.ssh
  - chmod 700 /home/vya/.ssh
  - chmod 600 /home/vya/.ssh/authorized_keys 2>/dev/null || true

  # Disable root SSH login
  - sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - echo "PermitRootLogin no" >> /etc/ssh/sshd_config
  - systemctl restart sshd

  # Setup UFW firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 22/tcp
  - ufw --force enable

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Add vya to docker group (already in users section, but ensure it)
  - usermod -aG docker vya

  # Run shared system setup (Node.js, Neovim, lazygit, R, npm packages, etc.)
  - /opt/setup-system.sh

  # Set ownership of vya home directory
  - chown -R vya:vya /home/vya

  # Add first-login trigger to bashrc/zshrc (runs setup-user.sh once)
  - |
    echo '[ -f ~/setup-user.sh ] && [ ! -f ~/.first-login-complete ] && ~/setup-user.sh && touch ~/.first-login-complete' >> /home/vya/.bashrc
    echo '[ -f ~/setup-user.sh ] && [ ! -f ~/.first-login-complete ] && ~/setup-user.sh && touch ~/.first-login-complete' >> /home/vya/.zshrc 2>/dev/null || true
    chown vya:vya /home/vya/.bashrc

# Final message
final_message: |
  Cloud-init setup complete!

  SSH as user 'vya' (root login is disabled).
  On first login, setup-user.sh will run automatically to install:
  - uv and Python 3.12
  - Neovim plugins
  - Oh My Zsh with Powerlevel10k
  - Your dotfiles
