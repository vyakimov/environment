#cloud-config

# User setup
users:
  - name: vya
    groups: sudo, docker
    shell: /bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    # Generate hash with: mkpasswd --method=SHA-512 YOUR_PASSWORD
    # Or: python3 -c "import crypt; print(crypt.crypt('YOUR_PASSWORD', crypt.mksalt(crypt.METHOD_SHA512)))"
    passwd: $6$PLACEHOLDER$REPLACE_THIS_WITH_YOUR_HASHED_PASSWORD

# Package management
package_update: true
package_upgrade: true

packages:
  # Base utilities
  - curl
  - wget
  - git
  - zsh
  - zip
  - unzip
  - tmux
  - python3-venv
  - python3-pip
  # Locale and build tools
  - locales
  - build-essential
  - software-properties-common
  # Dev tools
  - fzf
  - ripgrep
  - fd-find
  - luarocks
  # Security
  - ufw
  - fail2ban
  # Docker dependencies
  - ca-certificates
  - gnupg
  - lsb-release
  # Build dependencies for tmux (if building from source)
  - libevent-dev
  - ncurses-dev
  - bison
  # Python build dependencies
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libffi-dev
  - liblzma-dev
  - tk-dev
  - libxml2-dev

# Locale setup
locale: en_US.UTF-8

# Write files
write_files:
  # First-login setup script for vya user
  - path: /home/vya/first-login-setup.sh
    permissions: '0755'
    owner: vya:vya
    content: |
      #!/bin/bash
      set -e

      # Colors
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m'

      MARKER_FILE="$HOME/.first-login-complete"

      if [ -f "$MARKER_FILE" ]; then
        echo -e "${YELLOW}First-login setup already completed.${NC}"
        exit 0
      fi

      echo -e "${GREEN}Running first-login setup...${NC}"

      # Install uv
      echo -e "${GREEN}Installing uv...${NC}"
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"

      # Setup Python with uv
      echo -e "${GREEN}Setting up Python 3.12...${NC}"
      uv python install 3.12
      uv venv --python 3.12

      # Set up environment variables
      export VIRTUAL_ENV="$HOME/.venv"
      export UV_CACHE_DIR="$HOME/.uv-cache"
      export UV_PROJECT_ENVIRONMENT="$HOME/.venv"
      export PATH="$VIRTUAL_ENV/bin:$HOME/.local/bin:$PATH"

      # Install Python tools
      echo -e "${GREEN}Installing Python tools...${NC}"
      uv tool install 'vectorcode[lsp,mcp]'
      uv pip install --upgrade ipython pyright

      # Clone neovim config
      echo -e "${GREEN}Setting up Neovim config...${NC}"
      if [ ! -d "$HOME/.config/nvim" ]; then
        git clone https://github.com/vyakimov/neovim_setup.git ~/.config/nvim
        nvim --headless "+Lazy! sync" +qa || true
      fi

      # Run dotfiles bootstrap
      echo -e "${GREEN}Setting up dotfiles...${NC}"
      if [ -f "$HOME/bootstrap.sh" ]; then
        chmod +x "$HOME/bootstrap.sh"
        "$HOME/bootstrap.sh"
      fi

      # Setup alacritty terminfo
      echo -e "${GREEN}Setting up alacritty terminfo...${NC}"
      curl -sSL https://raw.githubusercontent.com/alacritty/alacritty/master/extra/alacritty.info | tic -x - 2>/dev/null || true

      # Mark setup as complete
      touch "$MARKER_FILE"
      echo -e "${GREEN}First-login setup complete!${NC}"
      echo -e "${YELLOW}Please log out and log back in, or run: source ~/.zshrc${NC}"

  # Bootstrap script (dotfiles setup)
  - path: /home/vya/bootstrap.sh
    permissions: '0755'
    owner: vya:vya
    content: |
      #!/bin/bash
      set -e
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      NC='\033[0m'

      echo -e "${GREEN}Starting dotfiles setup...${NC}"

      if ! grep -q "^\.cfg\.git$" "$HOME/.gitignore" 2>/dev/null; then
        echo ".cfg.git" >>"$HOME/.gitignore"
        echo -e "${GREEN}Added .cfg.git to .gitignore${NC}"
      fi

      echo -e "${GREEN}Cloning dotfiles repository...${NC}"
      if [ -d "$HOME/.cfg.git" ]; then
        rm -rf "$HOME/.cfg.git"
      fi
      git clone --bare https://github.com/vyakimov/dotfiles.git "$HOME/.cfg.git"

      mkdir -p "$HOME/.config-backup"

      CONFLICTS=$(git --git-dir="$HOME/.cfg.git/" --work-tree="$HOME" checkout 2>&1 | grep -E "^\s+" | awk '{print $1}' || true)

      if [ -n "$CONFLICTS" ]; then
        echo -e "${YELLOW}Found conflicting files, backing up:${NC}"
        echo "$CONFLICTS" | while read -r file; do
          if [ -n "$file" ] && [ -e "$HOME/$file" ]; then
            mkdir -p "$HOME/.config-backup/$(dirname "$file")"
            mv "$HOME/$file" "$HOME/.config-backup/$file"
            echo -e "  ${YELLOW}Backed up: $file${NC}"
          fi
        done
      fi

      git --git-dir="$HOME/.cfg.git/" --work-tree="$HOME" checkout
      git --git-dir="$HOME/.cfg.git/" --work-tree="$HOME" config --local status.showUntrackedFiles no

      # Install Oh My Zsh
      if [ ! -d "$HOME/.oh-my-zsh" ]; then
        git clone https://github.com/ohmyzsh/ohmyzsh.git "$HOME/.oh-my-zsh"
      fi

      # Install Powerlevel10k
      ZSH_CUSTOM="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}"
      if [ ! -d "$ZSH_CUSTOM/themes/powerlevel10k" ]; then
        git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$ZSH_CUSTOM/themes/powerlevel10k"
      fi

      # Install zsh-vim-mode
      if [ ! -d "$HOME/.oh-my-zsh/plugins/zsh-vim-mode" ]; then
        git clone https://github.com/softmoth/zsh-vim-mode.git "$HOME/.oh-my-zsh/plugins/zsh-vim-mode"
      fi

      # Configure tmux
      touch "$HOME/.tmux.conf"
      grep -q "terminal-overrides.*xterm:Tc" "$HOME/.tmux.conf" 2>/dev/null || echo "set-option -ga terminal-overrides ',xterm:Tc'" >>"$HOME/.tmux.conf"
      grep -q "set -g set-clipboard on" "$HOME/.tmux.conf" 2>/dev/null || echo "set -g set-clipboard on" >>"$HOME/.tmux.conf"
      grep -q "set -g allow-passthrough on" "$HOME/.tmux.conf" 2>/dev/null || echo "set -g allow-passthrough on" >>"$HOME/.tmux.conf"

      echo -e "${GREEN}Dotfiles setup complete!${NC}"

  # Environment variables for zsh
  - path: /home/vya/.zshenv.local
    permissions: '0644'
    owner: vya:vya
    content: |
      export LANG=en_US.UTF-8
      export LANGUAGE=en_US:en
      export LC_ALL=en_US.UTF-8
      export TERM=xterm-256color
      export VIRTUAL_ENV="$HOME/.venv"
      export UV_CACHE_DIR="$HOME/.uv-cache"
      export UV_PROJECT_ENVIRONMENT="$HOME/.venv"
      export PATH="$VIRTUAL_ENV/bin:$HOME/.local/bin:$PATH"

# Run commands
runcmd:
  # Generate locale
  - locale-gen en_US.UTF-8
  - update-locale LANG=en_US.UTF-8

  # Copy SSH keys from root to vya
  - mkdir -p /home/vya/.ssh
  - cp /root/.ssh/authorized_keys /home/vya/.ssh/authorized_keys 2>/dev/null || true
  - chown -R vya:vya /home/vya/.ssh
  - chmod 700 /home/vya/.ssh
  - chmod 600 /home/vya/.ssh/authorized_keys 2>/dev/null || true

  # Disable root SSH login
  - sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - echo "PermitRootLogin no" >> /etc/ssh/sshd_config
  - systemctl restart sshd

  # Setup UFW firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 22/tcp
  - ufw --force enable

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Add vya to docker group (already in users section, but ensure it)
  - usermod -aG docker vya

  # Install Node.js
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - npm config set prefix /usr/local/
  - npm install -g @anthropic-ai/claude-code mcp-hub @openai/codex @github/copilot-language-server

  # Install lazygit
  - |
    LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" | grep -Po '"tag_name": *"v\K[^"]*')
    curl -Lo /tmp/lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/download/v${LAZYGIT_VERSION}/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz"
    tar xf /tmp/lazygit.tar.gz -C /tmp lazygit
    install /tmp/lazygit /usr/local/bin/

  # Install Neovim
  - curl -LO https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz
  - tar xzf nvim-linux-x86_64.tar.gz -C /opt
  - ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
  - rm nvim-linux-x86_64.tar.gz

  # Set ownership of vya home directory
  - chown -R vya:vya /home/vya

  # Add first-login trigger to bashrc/zshrc (runs once)
  - |
    echo '[ -f ~/first-login-setup.sh ] && [ ! -f ~/.first-login-complete ] && ~/first-login-setup.sh' >> /home/vya/.bashrc
    echo '[ -f ~/first-login-setup.sh ] && [ ! -f ~/.first-login-complete ] && ~/first-login-setup.sh' >> /home/vya/.zshrc 2>/dev/null || true
    chown vya:vya /home/vya/.bashrc

# Final message
final_message: |
  Cloud-init setup complete!

  SSH as user 'vya' (root login is disabled).
  On first login, run: ~/first-login-setup.sh

  This will install:
  - uv and Python 3.12
  - Neovim plugins
  - Oh My Zsh with Powerlevel10k
  - Your dotfiles
